# ===========================================================================
# pi-system — SEO auditor site list (EXAMPLE)
# ---------------------------------------------------------------------------
# The list of sites the SEO auditor checks. These are the sites YOU OWN — your own
# portfolio plus the client sites you host. Audit only sites you are authorised to.
#
# Copy this file to data/seo/sites.conf (git-ignored) and edit it:
#     mkdir -p data/seo && cp services/seo/sites.example.conf data/seo/sites.conf
#
# FORMAT — one site per line:   <name> <url>
#   <name>  the storage key for this site's results (its "service name"): lowercase,
#           starts with a letter, then [a-z0-9-], 2-40 chars, no trailing hyphen.
#           Tip: use the generated project's name so audit history lines up with it.
#   <url>   the full public URL to audit (use the https:// URL).
# Blank lines and lines starting with '#' are ignored. Whitespace separates the two
# fields, so the name cannot contain spaces (it never does).
#
# scripts/seo.sh reads this file to resolve a site name -> URL and to expand
# `./scripts/seo.sh audit all`. Override the path with SEO_SITES_FILE in .env.
# ===========================================================================

# name                 url
# my-portfolio         https://example.com
# happy-teeth          https://teeth.example.com
# acme-store           https://shop.acme.example

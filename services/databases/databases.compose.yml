# ===========================================================================
# pi-system — on-demand database layer
# ---------------------------------------------------------------------------
# Four databases, each gated behind its own Docker Compose PROFILE so that
# NOTHING here starts unless you explicitly ask for it. Start only the
# engine(s) a given project needs — never all of them at once:
#
#   PostgreSQL  -> profile "postgres"   (relational; the recommended default)
#   MySQL       -> profile "mysql"      (relational)
#   MongoDB     -> profile "mongo"      (document)
#   Redis       -> profile "redis"      (key/value cache + store)
#
# Every database is INTERNAL-ONLY: it attaches to the shared `internal`
# network, publishes NO host ports, and is reached by other containers via its
# service name (an app connects to `postgres:5432`, `redis:6379`, ...).
# Credentials come strictly from the root .env — none are baked in here.
#
# ALWAYS run together with the base compose file so the `internal` network
# (and its subnet/IPAM) is inherited, and pass the matching profile:
#
#   docker compose --env-file .env \
#     -f infrastructure/docker-compose.yml \
#     -f services/databases/databases.compose.yml \
#     --profile postgres up -d
#
# Or simply use the helper:   ./scripts/db.sh postgres up
#
# .NET NOTE: SQL Server (including Azure SQL Edge) is NOT reliably ARM64 on a
# Raspberry Pi — use PostgreSQL as the primary relational database. There is
# deliberately NO SQL Server service here.
#
# HARD RULES (see infrastructure/docker-compose.yml):
#   * ARM64 (linux/arm64) images only — this runs on a Pi 5. Tags below are
#     verified multi-arch incl. linux/arm64/v8 (the Pi 5's Cortex-A76).
#   * Every image pinned to an explicit tag. NEVER "latest".
#   * No secrets in this file — values come from the root .env only.
#   * Databases attach to `internal` ONLY (never `proxy`) and publish no ports.
# ===========================================================================

name: ${COMPOSE_PROJECT_NAME:-pi-system}

services:
  # -------------------------------------------------------------------------
  # PostgreSQL — the RECOMMENDED relational database for this platform.
  # Excellent ARM64 support and the natural relational choice for .NET (Npgsql
  # / EF Core) and Next.js (Prisma, etc.) alike. Reached internally as
  # `postgres:5432`. Profile "postgres": only starts when that profile is on.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine                  # multi-arch incl. linux/arm64
    container_name: ${COMPOSE_PROJECT_NAME:-pi-system}_postgres
    profiles: ["postgres"]
    restart: unless-stopped
    networks:
      - internal            # internal-only; reached as `postgres:5432`
    security_opt:
      - no-new-privileges:true
    # Credentials come strictly from .env (the image REQUIRES POSTGRES_PASSWORD).
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation so the literal $VAR reaches the shell
      # INSIDE the container, where POSTGRES_USER / POSTGRES_DB are defined.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # -------------------------------------------------------------------------
  # MySQL — alternative relational engine (Oracle's official image, which does
  # publish a linux/arm64 build for the 8.4 LTS line). Reached internally as
  # `mysql:3306`. The heaviest of the four — see its memory limit below.
  # Profile "mysql": only starts when that profile is on.
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.4.3                            # multi-arch incl. linux/arm64
    container_name: ${COMPOSE_PROJECT_NAME:-pi-system}_mysql
    profiles: ["mysql"]
    restart: unless-stopped
    networks:
      - internal            # internal-only; reached as `mysql:3306`
    security_opt:
      - no-new-privileges:true
    # All credentials from .env. MYSQL_ROOT_PASSWORD is required by the image;
    # MYSQL_USER/PASSWORD/DATABASE provision a non-root app user + database.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ keeps the password expansion inside the container (never on the host
      # or in the compose file). --silent => clean exit code for the check.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s     # first-boot init (data dir + grants) takes a moment
    deploy:
      resources:
        limits:
          memory: 512M

  # -------------------------------------------------------------------------
  # MongoDB — document database. The official image publishes linux/arm64.
  # NOTE: MongoDB 5.0+ requires ARMv8.2-A; the Pi 5 (Cortex-A76) satisfies
  # this, but an older Pi 4 (Cortex-A72) does NOT and would crash. Reached
  # internally as `mongo:27017`. Profile "mongo": only starts when on.
  # -------------------------------------------------------------------------
  mongo:
    image: mongo:7.0.14                           # multi-arch incl. linux/arm64
    container_name: ${COMPOSE_PROJECT_NAME:-pi-system}_mongo
    profiles: ["mongo"]
    restart: unless-stopped
    networks:
      - internal            # internal-only; reached as `mongo:27017`
    security_opt:
      - no-new-privileges:true
    # Root credentials from .env; MONGO_INITDB_DATABASE seeds an initial db.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    # Pin WiredTiger's internal cache to 0.25 GiB (256M), BELOW the 512M cgroup
    # cap (deploy limits.memory). Left unset, MongoDB sizes this cache from the
    # HOST's RAM (~50% of RAM-1GiB), which on an 8GB Pi is multiple GiB — far
    # over the container cap, so the kernel OOM-kills it. Capping the cache makes
    # it fit and degrade gracefully; the gap under the cap covers connections,
    # in-memory sorts/aggregation and other non-cache overhead. The cgroup cap is
    # unchanged — we only align the runtime's internal ceiling to it. Keep
    # `mongod` as arg 0 so the image entrypoint still runs MONGO_INITDB_* setup.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # adminCommand({ ping: 1 }) needs no authentication and simply confirms
      # the server is accepting connections.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # -------------------------------------------------------------------------
  # Redis — in-memory key/value store + cache, with AOF persistence so data
  # survives restarts (written into the redis_data volume). Reached internally
  # as `redis:6379`. Profile "redis": only starts when on.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.4.1-alpine                     # multi-arch incl. linux/arm64
    container_name: ${COMPOSE_PROJECT_NAME:-pi-system}_redis
    profiles: ["redis"]
    restart: unless-stopped
    networks:
      - internal            # internal-only; reached as `redis:6379`
    security_opt:
      - no-new-privileges:true
    # Password is taken from the env var (set from .env), kept OFF the process
    # args. The official redis image has no REDIS_PASSWORD convention, so we
    # start the server ourselves and pass --requirepass from the environment.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # --maxmemory sets Redis's OWN ceiling BELOW the 256M cgroup cap (deploy
    # limits.memory) so that, used as a CACHE, it evicts keys (allkeys-lru) when
    # full instead of growing until the kernel OOM-kills the container. 200mb
    # leaves headroom under the cap for Redis's own overhead (buffers, AOF
    # copy-on-write). The cgroup cap is unchanged — we only align the runtime's
    # internal ceiling to it, turning OOM-kill into graceful eviction.
    # CAUTION: this assumes Redis is a CACHE (evictable). If you ever use it as a
    # DURABLE store, switch --maxmemory-policy to `noeviction` (so writes error
    # rather than silently dropping data) AND raise both --maxmemory and the
    # cgroup limit accordingly.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

# ---------------------------------------------------------------------------
# Named volumes for persistent state. Compose prefixes them with the project
# name, e.g. "pi-system_postgres_data". Each database keeps its data here, so
# `./scripts/db.sh <engine> down` removes only the container — data survives.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:

# ---------------------------------------------------------------------------
# Shared network. Declared so this file merges cleanly with the base compose
# file (which supplies the subnet/IPAM). The name MUST match the base file —
# do NOT invent a new network. Databases only ever touch `internal`; they are
# never placed on `proxy`.
# ---------------------------------------------------------------------------
networks:
  internal:
    name: ${INTERNAL_NETWORK_NAME:-pi_internal}
    driver: bridge

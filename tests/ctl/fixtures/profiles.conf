# Test-only boot-profiles fixture for tests/ctl/run.sh.
# Uses REAL pi-system service names (so they map to real preflight components and
# stages), but is small and self-contained so the expected scope expansions are
# fixed and independent of edits to the real infrastructure/boot-profiles.conf.
#
# Same line-based "profile: members..." format as the real file. Members may be
# services, other profiles (expanded recursively), or label=MiB literals
# (planning allowances — ignored when resolving the preflight scope).

core: caddy portainer uptime-kuma watchtower homepage
dev: core postgres verdaccio nuget-cache
auth: core keycloak keycloak-db
automation: core n8n n8n-db

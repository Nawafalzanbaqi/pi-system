# Test-only boot-profiles fixture for tests/startup/run.sh.
# Uses REAL pi-system service names (so su_plan_from_services maps them to real
# stages), but is small and self-contained so the expected expansions are fixed
# and independent of edits to the real infrastructure/boot-profiles.conf.
#
# Same line-based "profile: members..." format as the real file. Members may be
# services, other profiles (expanded recursively), or label=MiB literals
# (planning allowances — ignored by the bring-up planner).

core: caddy portainer uptime-kuma watchtower homepage
dev: core postgres verdaccio nuget-cache
auth: core keycloak keycloak-db
automation: core n8n n8n-db
mixed: core postgres mysql pgadmin keycloak keycloak-db n8n n8n-db app-demo=512
ring1: caddy ring2
ring2: postgres ring1

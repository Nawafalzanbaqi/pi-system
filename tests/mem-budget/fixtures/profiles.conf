# Fixture boot-profiles map for the mem-budget tests. Mirrors the real format.
# Services resolve against fixtures/compose-a.yml + compose-b.yml:
#   alpha=256  beta=512  gamma=1024  delta=(no limit)

# Fits a small budget.
small: alpha beta

# References another PROFILE (small) + a service — exercises expansion + dedup.
medium: small gamma

# Exceeds a small budget; includes two literal project allowances.
big: medium app-x=2048 app-y=2048

# Includes a service with NO limit (delta) — missing-limit detection.
broken: alpha delta

# A reference CYCLE (ring1 -> ring2 -> ring1) — must terminate, not loop.
ring1: ring2 alpha
ring2: ring1 beta

# ===========================================================================
# pi-system — BOOT PROFILES (documented presets, NOT services)
# ---------------------------------------------------------------------------
# A boot profile is a named GROUP of services that are meant to run together on
# a constrained Pi. Profiles are NOT new always-on services and there is no
# orchestrator that reads this file to "boot" anything automatically — they are
# a small, reviewable mapping that:
#
#   * documents which sets of services are sane to run side by side, and
#   * feeds scripts/mem-budget.sh, the READ-ONLY memory-budget tool that sums a
#     profile's declared memory limits and checks them against the Pi's RAM
#     BEFORE you bring the services up.
#
# This file is the SINGLE SOURCE OF TRUTH for the profile -> members mapping.
# The per-service memory LIMITS are NOT duplicated here — mem-budget.sh reads
# those straight from the compose files (deploy.resources.limits.memory), so the
# two can never drift.
#
# FORMAT (line-based key:value, same plain-shell style as the module/preset
# manifests — parsed without YAML):
#
#     <profile>: <member> <member> ...        # members are space- or comma-separated
#
# A MEMBER is one of:
#   * a SERVICE name  — its limit is read from the compose files
#                       (caddy, portainer, postgres, keycloak, n8n, ...).
#   * another PROFILE — expanded recursively and de-duplicated (e.g. every
#                       profile below builds on "core"). Cycles are ignored.
#   * label=MiB       — a literal memory ALLOWANCE for planning, in MiB (a unit
#                       suffix like =1G also works). Used to model things that
#                       are not platform services, e.g. a generated PROJECT you
#                       intend to host. (label is any name without spaces.)
#
# Lines starting with '#' and blank lines are ignored. Keep it boring.
# ===========================================================================

# --- core --------------------------------------------------------------------
# The minimal ALWAYS-ON set: the public edge (Caddy), the management/monitoring
# trio (Portainer, Uptime Kuma, Watchtower) and the unified dashboard (Homepage).
# This is what you keep running 24/7. Footprint ~1.0 GiB.
core: caddy portainer uptime-kuma watchtower homepage

# --- dev ---------------------------------------------------------------------
# core + ONE relational database (PostgreSQL, the platform default) + the local
# package cache (faster, resilient npm/NuGet installs while you iterate). The
# quality gate (scripts/quality.sh) is ON-DEMAND and runs in throwaway SDK
# containers, so it is NOT a member here (see docs "Resource safety"). Swap
# `postgres` for `mysql`/`mongo`, or add `redis`, to match your project.
# Footprint ~1.9 GiB.
dev: core postgres verdaccio nuget-cache

# --- auth --------------------------------------------------------------------
# core + Keycloak and its OWN isolated database. Keycloak (JVM) is the heaviest
# single service on the platform — bring this profile up only when you actually
# need SSO, and take it down when idle. Footprint ~2.0 GiB.
auth: core keycloak keycloak-db

# --- automation --------------------------------------------------------------
# core + n8n and its OWN isolated database. Run it when you need the automation
# engine; take it down when idle. Footprint ~1.8 GiB.
automation: core n8n n8n-db

# --- full-ish (WARNING / illustrative — do NOT run as-is) ---------------------
# Everything the platform can run AT ONCE: core + every database + every admin
# UI + auth + automation + the package cache, PLUS two representative generated
# PROJECTS (the platform exists to host these). This is intentionally a "what
# NOT to run all at once on an 8 GB Pi" reference, not a runnable preset — it is
# expected to FAIL the budget on 8 GB and PASS comfortably on 16 GB. The two
# app-*=MiB entries are illustrative project allowances (a fullstack site with
# the content-admin CMS ~1.25 GiB; a second smaller fullstack site ~0.5 GiB).
# Footprint ~7.3 GiB.
full-ish: core postgres mysql mongo redis pgadmin adminer mongo-express keycloak keycloak-db n8n n8n-db verdaccio nuget-cache app-fullstack-cms=1280 app-fullstack=512

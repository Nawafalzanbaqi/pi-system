# ===========================================================================
# pi-system module: auth-sso (dotnet-api) — JWT validation env for "__PROJECT_NAME__"
# Generated __GENERATED_DATE__ by scripts/new-project.sh (module: auth-sso).
# ---------------------------------------------------------------------------
# Loaded ALONGSIDE the project's main fragment by scripts/project.sh. Adds NO new
# container and NO host ports — it only MERGES OIDC environment into the project's
# existing .NET service so it validates incoming JWT bearer tokens against the
# realm. (A separate client — e.g. a Next.js SPA or a fullstack frontend — performs
# the actual login and sends the access token to this API.)
#
# The auth itself is wired ADDITIVELY by Auth/OidcHostingStartup.cs (shipped under
# files/), activated by the ASPNETCORE_HOSTINGSTARTUPASSEMBLIES flag below — so this
# module never has to replace the base (or bookings') Program.cs / app.csproj.
# ===========================================================================

name: ${COMPOSE_PROJECT_NAME:-pi-system}

services:
  __PROJECT_NAME__:
    environment:
      # Activate the additive OIDC HostingStartup compiled into the app (assembly
      # name is fixed to "app" by the base csproj). Without this flag the startup is
      # inert and the API behaves exactly like the base.
      ASPNETCORE_HOSTINGSTARTUPASSEMBLIES: "app"
      # The realm URL — the API fetches its JWKS from {issuer}/.well-known/openid-configuration
      # and validates issuer + signing key on every request. Blank => auth OFF (the
      # protected endpoint returns 503; /health and the base endpoints stay public).
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      # Expected token audience. Blank => the API falls back to OIDC_CLIENT_ID (the
      # base already passes it to this service) as the audience; blank+no client id
      # => audience check is skipped (issuer + signature + lifetime still enforced).
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      # true (default) requires a trusted-HTTPS metadata endpoint. Set false in .env
      # ONLY for local *.localhost testing against Caddy's internal CA.
      OIDC_REQUIRE_HTTPS_METADATA: ${OIDC_REQUIRE_HTTPS_METADATA:-true}

networks:
  internal:
    name: ${INTERNAL_NETWORK_NAME:-pi_internal}
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK_NAME:-pi_proxy}
    driver: bridge

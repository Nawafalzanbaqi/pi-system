# ===========================================================================
# pi-system module: whatsapp-integration (dotnet-api) — sender env for "__PROJECT_NAME__"
# Generated __GENERATED_DATE__ by scripts/new-project.sh (module: whatsapp-integration).
# ---------------------------------------------------------------------------
# Loaded ALONGSIDE the project's main fragment by scripts/project.sh. Adds NO new
# container and NO host ports — it MERGES the WHATSAPP_* environment into the
# project's existing .NET service and activates the additive sender via the
# ASPNETCORE_HOSTINGSTARTUPASSEMBLIES flag (so it never replaces the base / bookings
# Program.cs / app.csproj; if auth-sso is also composed it sets the same flag to the
# same value, which Compose merges cleanly).
#
# Provider is chosen from WHATSAPP_PROVIDER: blank => "mock" (the safe default, no
# credentials needed — messages are logged). Set it to cloud_api in .env, with the
# Meta credentials, to send for real (see this module's SETUP.md).
# ===========================================================================

name: ${COMPOSE_PROJECT_NAME:-pi-system}

services:
  __PROJECT_NAME__:
    environment:
      # Activate the additive WhatsApp HostingStartup compiled into the app
      # (assembly name is fixed to "app" by the base csproj).
      ASPNETCORE_HOSTINGSTARTUPASSEMBLIES: "app"
      # Provider selector. Blank => mock. Set WHATSAPP_PROVIDER=cloud_api in .env.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      # Cloud API credentials (used only when WHATSAPP_PROVIDER=cloud_api).
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      # Inbound webhook (optional): verify token + app secret for X-Hub-Signature-256.
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}

networks:
  internal:
    name: ${INTERNAL_NETWORK_NAME:-pi_internal}
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK_NAME:-pi_proxy}
    driver: bridge
